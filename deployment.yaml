
apiVersion: apps/v1

kind: Deployment

metadata:
  name: week12-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: week12app

  template:
    metadata:
      labels:
        app: week12app

    spec:
      containers:
        - name: week12app

          image: tanzila123/basickubernetes:new
          ports:
            - containerPort: 5000